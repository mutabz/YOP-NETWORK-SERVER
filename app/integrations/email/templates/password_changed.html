<!--
code: PASSWORD_CHANGED
name: Password Changed
description: Notification sent after a user's password is changed.
source_module: SYSTEM
email_type: NOTIFICATION
subject: Your password has been changed
category: Authentication
tags:
  system: true
  authentication: true
variables:
  user: {}
  company: {}
  changed_at: ""
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>
</head>

<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8; padding:40px 15px;">
<tr>
<td align="center">

<table width="100%" cellpadding="0" cellspacing="0"
       style="max-width:620px; background:#ffffff; border-radius:12px; overflow:hidden;">

    <tr>
        <td style="background:#111827; padding:28px 35px; text-align:center;">
            <div style="font-size:24px; font-weight:bold; color:#ffffff;">
                {{ company.name }}
            </div>
        </td>
    </tr>

    <tr>
        <td style="padding:40px 35px;">

            <div style="text-align:center; margin-bottom:25px;">
                <div style="
                    display:inline-block;
                    width:56px;
                    height:56px;
                    line-height:56px;
                    border-radius:50%;
                    background:#ecfdf5;
                    color:#059669;
                    font-size:26px;
                ">
                    ✓
                </div>
            </div>

            <h1 style="text-align:center; margin:0 0 20px; font-size:26px; color:#111827;">
                Password changed
            </h1>

            <p style="font-size:15px; line-height:1.7; color:#4b5563;">
                Hello {{ user.name }},
            </p>

            <p style="font-size:15px; line-height:1.7; color:#4b5563;">
                Your account password has been successfully changed.
            </p>

            {% if changed_at %}
            <div style="background:#f9fafb; border:1px solid #e5e7eb; padding:18px; border-radius:8px; margin:25px 0;">
                <div style="font-size:12px; color:#6b7280;">
                    CHANGED AT
                </div>

                <div style="font-size:14px; color:#111827; margin-top:5px;">
                    {{ changed_at }}
                </div>
            </div>
            {% endif %}

            <div style="background:#fef2f2; border:1px solid #fecaca; padding:18px; border-radius:8px;">
                <strong style="color:#991b1b;">
                    Didn't make this change?
                </strong>

                <p style="margin:7px 0 0; color:#991b1b; font-size:14px; line-height:1.6;">
                    Contact your administrator immediately and secure your account.
                </p>
            </div>

        </td>
    </tr>

    <tr>
        <td style="background:#f9fafb; padding:22px 35px; text-align:center; border-top:1px solid #e5e7eb;">
            <div style="font-size:13px; color:#6b7280;">
                © {{ company.name }}
            </div>
        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
