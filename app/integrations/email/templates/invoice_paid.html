<!--
code: INVOICE_PAID
name: Invoice Paid
description: Notification sent when an invoice is fully paid.
source_module: ACCOUNTING
email_type: NOTIFICATION
subject: Invoice {{ invoice.invoice_number }} has been paid
category: Accounting
tags:
  system: true
  invoice: true
variables:
  customer: {}
  company: {}
  invoice: {}
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Paid</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;background:#f4f6f8;">
<tr><td align="center">

<table width="100%" cellpadding="0" cellspacing="0"
style="max-width:620px;background:#fff;border-radius:12px;overflow:hidden;">

<tr>
<td style="background:#111827;padding:28px;text-align:center;">
<strong style="font-size:24px;color:#fff;">{{ company.name }}</strong>
</td>
</tr>

<tr>
<td style="padding:40px 35px;">

<div style="text-align:center;">
<div style="display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;background:#ecfdf5;color:#059669;font-size:28px;">
✓
</div>
</div>

<h1 style="text-align:center;font-size:26px;color:#111827;margin:20px 0;">
Payment Complete
</h1>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Hello {{ customer.name }},
</p>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Your invoice has been successfully paid.
</p>

<div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:22px;margin:25px 0;">

<table width="100%">
<tr>
<td style="color:#065f46;font-size:13px;">INVOICE</td>
<td align="right" style="color:#064e3b;font-weight:bold;">
{{ invoice.invoice_number }}
</td>
</tr>

<tr>
<td style="padding-top:12px;color:#065f46;font-size:13px;">
AMOUNT PAID
</td>
<td align="right" style="padding-top:12px;color:#064e3b;font-size:18px;font-weight:bold;">
{{ invoice.total }}
</td>
</tr>
</table>

</div>

<p style="font-size:14px;color:#6b7280;">
Thank you for your payment.
</p>

</td>
</tr>

<tr>
<td style="background:#f9fafb;padding:22px;text-align:center;border-top:1px solid #e5e7eb;">
<span style="font-size:13px;color:#6b7280;">© {{ company.name }}</span>
</td>
</tr>

</table>

</td></tr>
</table>

</body>
</html>
