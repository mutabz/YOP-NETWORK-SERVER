<!--
code: ACCOUNT_DEACTIVATED
name: Account Deactivated
description: Notification sent when a user account is deactivated.
source_module: SYSTEM
email_type: NOTIFICATION
subject: Your account has been deactivated
category: Authentication
tags:
  system: true
  authentication: true
variables:
  user: {}
  company: {}
  reason: ""
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Deactivated</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;background:#f4f6f8;">
<tr><td align="center">

<table width="100%" cellpadding="0" cellspacing="0"
style="max-width:620px;background:#fff;border-radius:12px;overflow:hidden;">

<tr>
<td style="background:#111827;padding:28px;text-align:center;">
<strong style="font-size:24px;color:#fff;">{{ company.name }}</strong>
</td>
</tr>

<tr>
<td style="padding:40px 35px;">

<h1 style="font-size:26px;color:#111827;margin:0 0 20px;">
Account Deactivated
</h1>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Hello {{ user.name }},
</p>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Your account has been deactivated and you may no longer be able to access
the system.
</p>

{% if reason %}
<div style="background:#fef2f2;border:1px solid #fecaca;padding:18px;border-radius:8px;margin:25px 0;">
<div style="font-size:12px;color:#991b1b;">REASON</div>
<div style="font-size:14px;color:#7f1d1d;margin-top:7px;">
{{ reason }}
</div>
</div>
{% endif %}

<p style="font-size:14px;line-height:1.6;color:#6b7280;">
If you believe this was done in error, please contact your administrator.
</p>

</td>
</tr>

<tr>
<td style="background:#f9fafb;padding:22px;text-align:center;border-top:1px solid #e5e7eb;">
<span style="font-size:13px;color:#6b7280;">© {{ company.name }}</span>
</td>
</tr>

</table>

</td></tr>
</table>

</body>
</html>
