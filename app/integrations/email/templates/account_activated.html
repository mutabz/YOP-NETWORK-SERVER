<!--
code: ACCOUNT_ACTIVATED
name: Account Activated
description: Notification sent when a user account is activated.
source_module: SYSTEM
email_type: NOTIFICATION
subject: Your account has been activated
category: Authentication
tags:
  system: true
  authentication: true
variables:
  user: {}
  company: {}
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Activated</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;background:#f4f6f8;">
<tr><td align="center">

<table width="100%" cellpadding="0" cellspacing="0"
style="max-width:620px;background:#fff;border-radius:12px;overflow:hidden;">

<tr>
<td style="background:#111827;padding:28px 35px;text-align:center;">
<strong style="font-size:24px;color:#fff;">{{ company.name }}</strong>
</td>
</tr>

<tr>
<td style="padding:40px 35px;">

<div style="text-align:center;margin-bottom:25px;">
<div style="display:inline-block;width:56px;height:56px;line-height:56px;border-radius:50%;background:#ecfdf5;color:#059669;font-size:26px;">
✓
</div>
</div>

<h1 style="text-align:center;font-size:26px;color:#111827;margin:0 0 20px;">
Account Activated
</h1>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Hello {{ user.name }},
</p>

<p style="font-size:15px;line-height:1.7;color:#4b5563;">
Your account has been successfully activated.
You can now sign in and access the system.
</p>

<div style="background:#ecfdf5;border:1px solid #a7f3d0;padding:18px;border-radius:8px;margin-top:25px;">
<strong style="color:#065f46;">Your account is active.</strong>
<p style="margin:7px 0 0;font-size:14px;color:#065f46;">
You may now use the services provided by {{ company.name }}.
</p>
</div>

</td>
</tr>

<tr>
<td style="background:#f9fafb;padding:22px;text-align:center;border-top:1px solid #e5e7eb;">
<span style="font-size:13px;color:#6b7280;">© {{ company.name }}</span>
</td>
</tr>

</table>

</td></tr>
</table>

</body>
</html>
